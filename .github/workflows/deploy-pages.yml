# Retrigger: fresh clean run for log diagnosis (2026-08-16)
name: Deploy Kens Webspace to GitHub Pages

on:
  push:
    branches:
      - claude/honey-hairstyle-website-vqf6bj
      - main
  # workflow_dispatch only registers once this file is on the default
  # branch; until then, retrigger via a push to one of the branches above.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
