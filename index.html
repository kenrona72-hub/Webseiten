<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kens Webspace</title>
<meta name="description" content="Kens Webspace – die Werkstatt-Übersicht aller Websites, die Ken baut und betreut.">
<meta name="theme-color" content="#0f1720">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kens Webspace">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="grid-bg" aria-hidden="true"></div>

<header class="titleblock">
  <div class="titleblock-inner">
    <div class="tb-mark">KW</div>
    <div class="tb-main">
      <h1>Kens Webspace</h1>
      <p class="tb-sub">Werkstatt für Websites &mdash; Projekte, Status &amp; Links an einem Ort.</p>
    </div>
    <div class="tb-meta">
      <span class="tb-meta-row"><span>Projekte</span><strong id="projectCount">&mdash;</strong></span>
      <span class="tb-meta-row"><span>Live</span><strong id="liveCount">&mdash;</strong></span>
    </div>
  </div>
</header>

<main id="main">
  <section class="board" aria-label="Projekte">
    <div id="cardGrid" class="card-grid"><!-- Karten werden per JS aus projects.json gerendert --></div>
  </section>
</main>

<footer class="site-footer">
  <p>Kens Webspace &mdash; zuletzt aktualisiert <span id="lastUpdated">&mdash;</span></p>
</footer>

<button id="installBtn" class="install-btn" hidden>
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3v13m0 0 5-5m-5 5-5-5M5 20h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span>Zum Home-Bildschirm hinzufügen</span>
</button>

<script src="js/app.js"></script>
</body>
</html>
